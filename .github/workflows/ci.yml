name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 || true

      - name: Run tests
        run: |
          if [ -d tests ] || ls *_test.py 1> /dev/null 2>&1; then
            pytest -q || true
          else
            echo "No tests found"
          fi

      - name: Lint
        run: |
          flake8 . || true
